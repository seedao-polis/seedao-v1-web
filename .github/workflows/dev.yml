name: Deploy to test.seedao.xyz

# Disabled: site is deployed via Docker to v1.seedao.xyz (see deploy/README.md).
# Re-enable push trigger only if you still need GitHub Pages on test.seedao.xyz
# and configure repo secret PERSONAL_TOKEN with push access to SeeDAO-OpenSource/test.seedao.xyz.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout
       uses: actions/checkout@v3

     - name: Setup Node
       uses: actions/setup-node@v2
       with:
         node-version: '20'

     - name: Compile
       env:
         CI: false
       run: |
         yarn;
         yarn build;

     - name: Pushes to another repository
       run: |
         git clone --single-branch --branch "master" "https://xrdavies:${{ secrets.PERSONAL_TOKEN }}@github.com/SeeDAO-OpenSource/test.seedao.xyz.git";
         cd test.seedao.xyz;
         git config --global user.name dev;
         git config --global user.email dev@seedao.xyz;
         rm -rf *
         cp -R ../build/* .;
         echo "test.seedao.xyz" > CNAME
         git add .;
         git status;
         git commit -m "deploy";
         git status;
         git push "https://xrdavies:${{ secrets.PERSONAL_TOKEN }}@github.com/SeeDAO-OpenSource/test.seedao.xyz.git" --set-upstream master
