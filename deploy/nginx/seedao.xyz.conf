# SeedAO marketing site — HTTP (Certbot will add SSL after success)
# Upload to: /etc/nginx/conf.d/seedao.xyz.conf
#
# Prerequisites:
#   - DNS A: seedao.xyz / www → this server
#   - Frontend container: 127.0.0.1:3000 (seedao-website)
#   - sudo mkdir -p /var/www/certbot

server {
    listen 80;
    listen [::]:80;
    server_name www.seedao.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 http://seedao.xyz$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name seedao.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
